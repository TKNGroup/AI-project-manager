services:
  aipm-pg:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aipm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - aipm-database:/data
    ports:
      - '5432:5432'
    networks:
      - aipm-network

volumes:
  aipm-database:
    name: aipm-database

networks:
  aipm-network:
    name: aipm-network
    driver: bridge
