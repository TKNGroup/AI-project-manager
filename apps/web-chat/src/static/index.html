<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIPM — Web Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e1621;
      color: #e8eaed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: #17212b;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2b3547;
      flex-shrink: 0;
    }
    .header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4cb051; flex-shrink: 0; transition: background 0.3s; }
    .dot.offline { background: #e53935; }
    .header-meta { margin-left: auto; font-size: 11px; color: #607d8b; }

    /* ── Main layout ── */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── Chat panel ── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2b3547;
      min-width: 0;
    }
    .panel-title {
      padding: 10px 16px;
      font-size: 11px;
      color: #607d8b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: #17212b;
      border-bottom: 1px solid #2b3547;
      flex-shrink: 0;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #2b3547; border-radius: 2px; }

    .msg {
      max-width: 72%;
      padding: 8px 12px 6px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
    .msg.user {
      align-self: flex-end;
      background: #2b5278;
      border-bottom-right-radius: 3px;
    }
    .msg.bot {
      align-self: flex-start;
      background: #182533;
      border: 1px solid #2b3547;
      border-bottom-left-radius: 3px;
    }
    .msg .sender { font-size: 11px; font-weight: 600; margin-bottom: 3px; }
    .msg.user .sender { color: #7ab3e0; }
    .msg.bot .sender { color: #4cb051; }
    .msg .time { font-size: 10px; color: #607d8b; text-align: right; margin-top: 4px; }

    .system-msg {
      align-self: center;
      font-size: 11px;
      color: #607d8b;
      padding: 4px 0;
    }

    /* Typing indicator */
    .typing {
      align-self: flex-start;
      background: #182533;
      border: 1px solid #2b3547;
      border-radius: 12px;
      border-bottom-left-radius: 3px;
      padding: 10px 14px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .typing span {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #607d8b;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }

    /* ── Input area ── */
    .input-area {
      padding: 10px 12px;
      background: #17212b;
      display: flex;
      gap: 8px;
      border-top: 1px solid #2b3547;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      background: #2b3547;
      border: none;
      border-radius: 20px;
      padding: 9px 16px;
      color: #e8eaed;
      font-size: 14px;
      outline: none;
      transition: background 0.2s;
    }
    .input-area input:focus { background: #354a5e; }
    .input-area input::placeholder { color: #607d8b; }
    .input-area button {
      background: #2b5278;
      border: none;
      border-radius: 50%;
      width: 38px; height: 38px;
      cursor: pointer;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .input-area button:hover { background: #3b6fa0; }
    .input-area button:active { background: #1e3d5c; }

    /* ── Tasks panel ── */
    .tasks-panel {
      width: 340px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .tasks-header {
      padding: 10px 16px;
      font-size: 11px;
      color: #607d8b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: #17212b;
      border-bottom: 1px solid #2b3547;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .task-count {
      background: #2b3547;
      color: #4cb051;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 10px;
    }
    .tasks-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tasks-list::-webkit-scrollbar { width: 4px; }
    .tasks-list::-webkit-scrollbar-thumb { background: #2b3547; border-radius: 2px; }

    .task-card {
      background: #182533;
      border: 1px solid #2b3547;
      border-radius: 8px;
      padding: 10px 12px;
      animation: fadeIn 0.2s ease;
      transition: border-color 0.3s;
    }
    .task-card.new-task {
      border-color: #4cb051;
      box-shadow: 0 0 10px rgba(76, 176, 81, 0.15);
    }
    .task-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
      color: #e8eaed;
      line-height: 1.4;
    }
    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 6px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      background: #2b3547;
      color: #8ea1b4;
      white-space: nowrap;
    }
    .badge-open { background: rgba(76,176,81,0.15); color: #4cb051; }
    .badge-done { background: rgba(91,155,213,0.15); color: #5b9bd5; }
    .badge-in_progress { background: rgba(255,183,77,0.15); color: #ffb74d; }
    .task-desc {
      font-size: 11px;
      color: #607d8b;
      line-height: 1.5;
      margin-top: 4px;
    }

    .empty-state {
      color: #607d8b;
      font-size: 13px;
      text-align: center;
      padding: 32px 16px;
      line-height: 1.8;
    }

    /* ── Members section ── */
    .members-section {
      border-bottom: 1px solid #2b3547;
      flex-shrink: 0;
    }
    .members-header {
      padding: 8px 16px;
      font-size: 11px;
      color: #607d8b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: #17212b;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      user-select: none;
    }
    .members-header:hover { color: #8ea1b4; }
    .members-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
    .member-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #8ea1b4;
    }
    .member-username { color: #5b9bd5; }
    .member-name { color: #e8eaed; }
    .member-form {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }
    .member-form input {
      flex: 1;
      background: #2b3547;
      border: none;
      border-radius: 6px;
      padding: 5px 8px;
      color: #e8eaed;
      font-size: 11px;
      outline: none;
      min-width: 0;
    }
    .member-form input::placeholder { color: #607d8b; }
    .member-form button {
      background: #2b5278;
      border: none;
      border-radius: 6px;
      padding: 5px 8px;
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .member-form button:hover { background: #3b6fa0; }

    @media (max-width: 700px) {
      .tasks-panel { display: none; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="dot" id="statusDot"></div>
  <h1>AIPM — Project Manager Bot</h1>
  <span class="header-meta">chat_id: 42</span>
</div>

<div class="main">
  <div class="chat-panel">
    <div class="panel-title">💬 Чат с ботом</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Написать сообщение..." autocomplete="off" />
      <button id="sendBtn" title="Отправить">➤</button>
    </div>
  </div>

  <div class="tasks-panel">
    <div class="members-section">
      <div class="members-header" id="membersToggle">
        <span>👥 Участники</span>
        <span id="membersArrow">▾</span>
      </div>
      <div class="members-body" id="membersBody">
        <div id="membersList"></div>
        <div class="member-form">
          <input id="memberUsername" placeholder="@username" />
          <input id="memberName" placeholder="Имя Фамилия" />
          <button id="memberAddBtn">+</button>
        </div>
      </div>
    </div>

    <div class="tasks-header">
      <span>📋 Задачи в БД</span>
      <span class="task-count" id="taskCount">0</span>
    </div>
    <div class="tasks-list" id="tasksList">
      <div class="empty-state">Задач пока нет.<br>Напишите боту что-нибудь вроде<br><em>«Сделать дизайн до пятницы, отв. Иван»</em></div>
    </div>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const tasksList = document.getElementById('tasksList');
  const taskCountEl = document.getElementById('taskCount');

  let ws = null;
  let typingEl = null;
  const knownTaskIds = new Set();

  // ── WebSocket ──────────────────────────────────────────

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);

    ws.onopen = () => {
      statusDot.classList.remove('offline');
      appendSystem('Подключено');
    };

    ws.onclose = () => {
      statusDot.classList.add('offline');
      appendSystem('Соединение потеряно. Переподключение...');
      setTimeout(connect, 3000);
    };

    ws.onerror = () => {
      ws.close();
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'bot') {
        removeTyping();
        appendMessage('bot', msg.text, 'AIPM Bot');
      }
    };
  }

  // ── Messages ───────────────────────────────────────────

  function now() {
    return new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }

  function appendMessage(type, text, name) {
    removeTyping();
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.innerHTML = `<div class="sender">${esc(name)}</div>${esc(text)}<div class="time">${now()}</div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendSystem(text) {
    const div = document.createElement('div');
    div.className = 'system-msg';
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement('div');
    typingEl.className = 'typing';
    typingEl.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  // ── Send ───────────────────────────────────────────────

  function sendMessage() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    appendMessage('user', text, 'Вы');
    ws.send(JSON.stringify({ type: 'message', text }));
    showTyping();
    input.value = '';
    input.focus();
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  // ── Tasks ──────────────────────────────────────────────

  async function loadTasks() {
    try {
      const res = await fetch('/api/tasks');
      if (!res.ok) return;
      const tasks = await res.json();

      taskCountEl.textContent = tasks.length;

      if (tasks.length === 0) {
        tasksList.innerHTML = '<div class="empty-state">Задач пока нет.<br>Напишите боту что-нибудь вроде<br><em>«Сделать дизайн до пятницы, отв. Иван»</em></div>';
        return;
      }

      tasksList.innerHTML = '';
      tasks.forEach(task => {
        const isNew = !knownTaskIds.has(task.id);
        if (isNew) knownTaskIds.add(task.id);

        const statusClass = `badge-${task.status}`;
        const card = document.createElement('div');
        card.className = `task-card${isNew ? ' new-task' : ''}`;
        card.innerHTML = `
          <div class="task-title">${esc(task.title)}</div>
          <div class="task-meta">
            <span class="badge ${statusClass}">${esc(task.status)}</span>
            ${task.assignee ? `<span class="badge">👤 ${esc(task.assignee)}</span>` : ''}
            ${task.reporter ? `<span class="badge">✏️ ${esc(task.reporter)}</span>` : ''}
            ${task.deadline ? `<span class="badge">📅 ${esc(task.deadline)}</span>` : ''}
          </div>
          ${task.description ? `<div class="task-desc">${esc(task.description)}</div>` : ''}
        `;
        tasksList.appendChild(card);
      });
    } catch (_) { /* ignore */ }
  }

  // ── Members ────────────────────────────────────────────

  const membersListEl = document.getElementById('membersList');
  const membersBody = document.getElementById('membersBody');
  let membersOpen = true;

  document.getElementById('membersToggle').addEventListener('click', () => {
    membersOpen = !membersOpen;
    membersBody.style.display = membersOpen ? '' : 'none';
    document.getElementById('membersArrow').textContent = membersOpen ? '▾' : '▸';
  });

  async function loadMembers() {
    try {
      const res = await fetch('/api/members');
      const members = await res.json();
      membersListEl.innerHTML = '';
      members.forEach(m => {
        const row = document.createElement('div');
        row.className = 'member-row';
        row.innerHTML = `<span class="member-username">@${esc(m.username)}</span>`
          + (m.display_name ? `<span>→</span><span class="member-name">${esc(m.display_name)}</span>` : '');
        membersListEl.appendChild(row);
      });
    } catch (_) {}
  }

  document.getElementById('memberAddBtn').addEventListener('click', async () => {
    const username = document.getElementById('memberUsername').value.trim().replace(/^@/, '');
    const display_name = document.getElementById('memberName').value.trim();
    if (!username) return;
    await fetch('/api/members', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, display_name }),
    });
    document.getElementById('memberUsername').value = '';
    document.getElementById('memberName').value = '';
    await loadMembers();
  });

  document.getElementById('memberName').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('memberAddBtn').click();
  });

  // ── Init ───────────────────────────────────────────────

  connect();
  loadTasks();
  loadMembers();
  setInterval(loadTasks, 3000);
  setInterval(loadMembers, 5000);
</script>
</body>
</html>
